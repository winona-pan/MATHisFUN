<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>質因數分解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lesson.css">
</head>
<body data-seq="6a-u1" data-page="6a-u1/02">
<div class="wrap">
  <div class="topbar" id="topbar"></div>

  <span class="kind k-learn">學會方法</span>
  <h1>質因數分解</h1>
  <p class="lead">把一個數一直拆，拆到全部都是質數為止。</p>

  <section class="box">
    <h2><span class="n">1</span>因數樹</h2>
    <div class="controls" style="margin-top:0" id="nums"></div>
    <div class="stage" style="margin-top:12px"><svg id="g" viewBox="0 0 400 260"></svg></div>
    <div class="controls"><button class="btn primary" id="split">拆一次 ✂</button><button class="btn" id="again">重來</button></div>
    <div class="work" id="w"></div>
  </section>

  <section class="box" data-steps>
    <h2><span class="n">2</span>方法</h2>
    <div class="steps">
      <div class="step"><p>① <b>質因數</b>：是質數的因數。例如 12 的因數 1、2、3、4、6、12 裡，2 和 3 是質數 → 質因數。</p></div>
      <div class="step"><p>② 從最小的質數 <b>2</b> 開始試著除，除不盡再試 3、5、7……</p></div>
      <div class="step"><p>③ 一直拆，直到每個樹葉都是質數（黃色）。</p></div>
      <div class="step"><p>④ 把樹葉乘起來：60 = 2 × 2 × 3 × 5。這叫<b>質因數分解</b>。</p></div>
    </div>
    <div class="controls"><button class="btn primary" data-next-step></button></div>
  </section>

  <div class="formula word">
    <div class="label">方法</div>
    <div class="big" style="font-size:1.3rem">從 2 開始除，一直拆到全部是質數</div>
    <div class="sub">60 = 2 × 2 × 3 × 5</div>
  </div>

  <div class="jh">
    <h2>🎒 國中預告</h2>
    <p>國中寫成「<b>標準分解式</b>」：<code>60 = 2² × 3 × 5</code>，同一個質數用次方合起來寫。</p>
  </div>

  <section class="box">
    <h2><span class="n">3</span>一直練：隨機出題</h2>
    <div id="prac"></div>
  </section>

  <nav class="pager" id="pager"></nav>
</div>
<script src="../assets/lesson.js"></script>
<script src="../assets/widgets.js"></script>
<script>
  const isP = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
  const NUMS = [12, 18, 36, 60, 84, 90];
  let N = 60, nodes;
  function reset() { nodes = [{ v: N, x: 200, y: 30, kids: null }]; draw(); }
  function leaves() { const L = []; (function go(n) { if (!n.kids) L.push(n); else n.kids.forEach(go); })(nodes[0]); return L; }
  function splitOnce() {
    const L = leaves().find(n => !isP(n.v));
    if (!L) return;
    let p = 2; while (L.v % p) p++;
    const dx = Math.max(28, 90 / (1 + (L.y - 30) / 50));
    L.kids = [{ v: p, x: L.x - dx, y: L.y + 52, kids: null }, { v: L.v / p, x: L.x + dx, y: L.y + 52, kids: null }];
    draw();
  }
  function draw() {
    let s = "";
    (function go(n) { if (n.kids) n.kids.forEach(k => { s += `<line x1="${n.x}" y1="${n.y + 14}" x2="${k.x}" y2="${k.y - 14}" stroke="var(--ink)" stroke-width="2"/>`; go(k); }); })(nodes[0]);
    (function go(n) {
      const p = isP(n.v), leaf = !n.kids;
      s += `<circle cx="${n.x}" cy="${n.y}" r="17" fill="${leaf && p ? "var(--yellow)" : "var(--card)"}" stroke="var(--ink)" stroke-width="2"/><text x="${n.x}" y="${n.y + 5}" text-anchor="middle" font-size="14">${n.v}</text>`;
      if (n.kids) n.kids.forEach(go);
    })(nodes[0]);
    document.getElementById("g").innerHTML = s;
    const L = leaves(), all = L.every(n => isP(n.v));
    document.getElementById("w").innerHTML = all ? `🎉 拆完了！${N} = <b>${L.map(n => n.v).sort((a, b) => a - b).join(" × ")}</b>` : `樹葉：${L.map(n => n.v).join(" × ")}　（還有白色的合數可以拆）`;
    document.getElementById("split").disabled = all;
    document.querySelectorAll("[data-n]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.n === N));
  }
  document.getElementById("nums").innerHTML = NUMS.map(n => `<button class="btn" data-n="${n}">${n}</button>`).join("");
  document.querySelectorAll("[data-n]").forEach(b => b.addEventListener("click", () => { N = +b.dataset.n; reset(); }));
  document.getElementById("split").addEventListener("click", splitOnce);
  document.getElementById("again").addEventListener("click", reset);
  reset();

  const fact = n => { const f = []; let p = 2; while (n > 1) { while (n % p === 0) { f.push(p); n /= p; } p++; } return f; };
  W.practice(document.getElementById("prac"), { gens: [
    () => { const n = W.pick([12, 18, 20, 24, 28, 30, 36, 40, 42, 45, 48, 50, 54, 56, 60, 63, 72, 84, 90, 100]), f = fact(n);
      const right = f.join(" × "), wrong1 = [...f.slice(0, -2), f[f.length - 2] * f[f.length - 1]].join(" × "), wrong2 = [...f, 2].join(" × ");
      const opts = [right, wrong1, wrong2].sort(() => Math.random() - .5);
      return { q: `<b>${n}</b> 的質因數分解是哪一個？`, choices: opts, ans: opts.indexOf(right), hint: "每一個都要是質數，而且乘起來要剛好等於原來的數", pic: `<text x="70" y="90" font-size="44">${n}</text>` }; },
    () => { const n = W.pick([12, 18, 24, 30, 36, 60, 90]), f = [...new Set(fact(n))]; return { q: `<b>${n}</b> 有幾個<b>不一樣的</b>質因數？`, ans: f.length, unit: "個", hint: `${n} = ${fact(n).join(" × ")}`, pic: `<text x="70" y="90" font-size="44">${n}</text>` }; },
  ] });
</script>
</body>
</html>
