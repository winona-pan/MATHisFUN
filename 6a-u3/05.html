<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圍成一圈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lesson.css">
</head>
<body data-seq="6a-u3" data-page="6a-u3/05">
<div class="wrap">
  <div class="topbar" id="topbar"></div>

  <span class="kind k-learn">學會方法</span>
  <h1>圍成一圈</h1>
  <p class="lead">繞池塘一圈種樹：頭和尾接在一起了，所以棵數 = 間隔數。</p>

  <section class="box">
    <h2><span class="n">1</span>把直線彎成一圈</h2>
    <div class="stage"><svg id="g" viewBox="0 0 400 230"></svg></div>
    <div class="controls">
      <label>間隔數 <input type="range" id="n" min="3" max="12" value="6"> <b id="nv"></b></label>
      <label>直線 ⇄ 一圈 <input type="range" id="t" min="0" max="100" value="100"></label>
    </div>
    <div class="work" id="w"></div>
  </section>

  <section class="box" data-steps>
    <h2><span class="n">2</span>為什麼？</h2>
    <div class="steps">
      <div class="step"><p>① 直線兩端都種：棵數 = 間隔數 + 1。</p></div>
      <div class="step"><p>② 把直線彎成一圈，<b>頭尾那兩棵樹碰在一起</b>，變成同一棵（拉動滑桿看看）。</p></div>
      <div class="step"><p>③ 少了一棵 → <b>棵數 = 間隔數</b>。</p></div>
      <div class="step"><p>④ 正方形、長方形的四周也一樣（圍成一圈）：周長 ÷ 間隔 = 棵數。</p></div>
    </div>
    <div class="controls"><button class="btn primary" data-next-step></button></div>
  </section>

  <div class="formula">
    <div class="label">公式</div>
    <div class="big" style="font-size:1.35rem">圍成一圈：棵數 = 間隔數 = 周長 ÷ 間隔</div>
  </div>

  <div class="jh">
    <h2>🎒 國中預告</h2>
    <p>國中算多邊形的頂點和邊：<b>n 邊形有 n 個頂點、n 條邊</b>，就是「圍成一圈」的規律。</p>
  </div>

  <section class="box">
    <h2><span class="n">3</span>一直練：隨機出題</h2>
    <div id="prac"></div>
  </section>

  <nav class="pager" id="pager"></nav>
</div>
<script src="../assets/lesson.js"></script>
<script src="../assets/widgets.js"></script>
<script>
  const nIn = document.getElementById("n"), tIn = document.getElementById("t");
  function draw() {
    const n = +nIn.value, t = +tIn.value / 100, R = 60, cx = 200, cy = 105, Lw = 2 * Math.PI * R;
    // 每個點：直線位置 → 圓上位置
    const pos = i => {
      const lineX = cx - Lw / 2 + Lw * i / n, lineY = 200;
      const [px, py] = L.pol(cx, cy, R, 180 + 360 * i / n);
      return [lineX + (px - lineX) * t, lineY + (py - lineY) * t];
    };
    let s = "";
    const pts = Array.from({ length: n + 1 }, (_, i) => pos(i));
    s += `<polyline points="${Array.from({ length: 61 }, (_, k) => pos(n * k / 60).join(",")).join(" ")}" fill="none" stroke="var(--blue)" stroke-width="4"/>`;
    pts.forEach(([x, y], i) => {
      const last = i === n, merged = last && t > 0.97;
      if (!merged) s += `<path d="M${x} ${y - 22} l-10 18 l20 0 Z" fill="${last ? "var(--orange)" : i === 0 ? "var(--orange)" : "var(--green)"}" stroke="var(--ink)" stroke-width="1"/>`;
    });
    if (t > 0.97) s += `<text x="${pts[0][0] - 60}" y="${pts[0][1] + 34}" font-size="12" style="fill:var(--orange)">頭尾變同一棵</text>`;
    document.getElementById("g").innerHTML = s;
    document.getElementById("nv").textContent = n;
    document.getElementById("w").innerHTML = t > 0.97 ? `${n} 個間隔，圍成一圈 → <b>${n} 棵</b>（頭尾橘色那棵只算一次）` : `${n} 個間隔，直線兩端都種 → ${n} + 1 = <b>${n + 1} 棵</b>（兩棵橘色）`;
  }
  nIn.addEventListener("input", draw); tIn.addEventListener("input", draw); draw();

  const P = `<circle cx="80" cy="75" r="50" fill="none" stroke="var(--blue)" stroke-width="3"/>${[0, 60, 120, 180, 240, 300].map(a => { const [x, y] = L.pol(80, 75, 50, a); return `<path d="M${x} ${y - 12} l-7 12 l14 0 Z" fill="var(--green)"/>`; }).join("")}<text x="140" y="80" font-size="13">棵數 = 間隔數</text>`;
  W.practice(document.getElementById("prac"), { gens: [
    () => { const gap = W.pick([2, 3, 4, 5, 10]), g = W.rand(6, 30); return { q: `圓形池塘一圈 ${gap * g} 公尺，每隔 ${gap} 公尺種一棵樹，共幾棵？`, ans: g, unit: "棵", hint: `${gap * g} ÷ ${gap}，圍成一圈不用 +1`, pic: P }; },
    () => { const s = W.rand(3, 10) * 2, gap = 2; return { q: `正方形花圃邊長 ${s} 公尺，四周每隔 ${gap} 公尺插一根旗子（四個角都要插），共幾根？`, ans: 4 * s / gap, unit: "根", hint: `周長 ${4 * s} ÷ ${gap}（圍成一圈）`, pic: `<rect x="40" y="25" width="110" height="110" fill="none" stroke="var(--blue)" stroke-width="3"/><text x="160" y="80" font-size="13">一圈</text>` }; },
    () => { const t = W.rand(8, 30), gap = W.pick([2, 3, 5]); return { q: `圓形跑道旁邊種了 ${t} 棵樹，每兩棵相隔 ${gap} 公尺。跑道一圈幾公尺？`, ans: t * gap, unit: "公尺", hint: `翻過來：${t} 個間隔 × ${gap}`, pic: P }; },
  ] });
</script>
</body>
</html>
