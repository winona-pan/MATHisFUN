<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用表格整理數量</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lesson.css">
<style>
  table.t { border-collapse: collapse; width: 100%; font-weight: 900; text-align: center; margin-top: 10px; }
  table.t td, table.t th { border: 2px solid var(--line); padding: 6px 4px; }
  table.t th { background: var(--bg); color: var(--muted); font-size: .9rem; }
  table.t td.hl { background: var(--yellow); color: #2b2a33; }
</style>
</head>
<body data-seq="6a-u6" data-page="review/tables">
<div class="wrap">
  <div class="topbar" id="topbar"></div>

  <span class="kind k-pre">先備知識・4–5 年級學過</span>
  <h1>用表格整理數量</h1>
  <p class="lead">兩個一起變化的量，排成表格，一欄一欄看它們怎麼變。</p>

  <section class="box">
    <h2><span class="n">1</span>買鉛筆</h2>
    <div class="stage"><svg id="g" viewBox="0 0 400 110"></svg></div>
    <div class="controls"><label>一枝 <input type="range" id="p" min="3" max="12" value="5"> <b id="pv"></b> 元</label><label>買 <input type="range" id="n" min="1" max="6" value="3"> <b id="nv"></b> 枝</label></div>
    <table class="t" id="tb"></table>
  </section>

  <div class="formula pre">
    <div class="label">記起來</div>
    <div class="big" style="font-size:1.3rem">上面一列放「會改變的量」，下面一列放「跟著變的量」</div>
    <div class="sub">一欄一欄往右看，找規律</div>
  </div>

  <div class="jh">
    <h2>🎒 國中預告</h2>
    <p>國中的「<b>函數</b>」常用表格表示：x 一列、y 一列，再畫到座標平面上。</p>
  </div>

  <section class="box">
    <h2><span class="n">2</span>練習一下</h2>
    <div class="quiz">
      <div class="q" data-answer="48" data-hint="每枝 8 元 × 6 枝">
        <p class="qt">表格：1 枝 8 元、2 枝 16 元、3 枝 24 元……6 枝幾元？</p>
        <div class="row"><input type="text" inputmode="decimal"> 元 <button class="btn">對答案</button></div>
      </div>
    </div>
  </section>

  <nav class="pager" id="pager"></nav>
</div>
<script src="../assets/lesson.js"></script>
<script>
  const P = document.getElementById("p"), N = document.getElementById("n");
  function draw() {
    const p = +P.value, n = +N.value;
    let s = "";
    for (let i = 0; i < n; i++) s += `<rect x="${20 + i * 30}" y="20" width="12" height="70" rx="3" fill="var(--yellow)" stroke="var(--ink)" stroke-width="1.5"/><path d="M${20 + i * 30} 20 l6 -12 l6 12" fill="#f1d3a1" stroke="var(--ink)" stroke-width="1.5"/>`;
    s += `<text x="220" y="60" font-size="16">${n} 枝 × ${p} 元 = ${n * p} 元</text>`;
    document.getElementById("g").innerHTML = s;
    document.getElementById("pv").textContent = p; document.getElementById("nv").textContent = n;
    document.getElementById("tb").innerHTML = `<tr><th>枝數</th>${[1, 2, 3, 4, 5, 6].map(i => `<td class="${i === n ? "hl" : ""}">${i}</td>`).join("")}</tr><tr><th>總價（元）</th>${[1, 2, 3, 4, 5, 6].map(i => `<td class="${i === n ? "hl" : ""}">${i * p}</td>`).join("")}</tr>`;
  }
  P.addEventListener("input", draw); N.addEventListener("input", draw); draw();
</script>
</body>
</html>
