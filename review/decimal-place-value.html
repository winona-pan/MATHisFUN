<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小數的位值</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lesson.css">
</head>
<body data-seq="6a-u5" data-page="review/decimal-place-value">
<div class="wrap">
  <div class="topbar" id="topbar"></div>

  <span class="kind k-pre">先備知識・3–4 年級學過</span>
  <h1>小數的位值</h1>
  <p class="lead">1 個大方塊切成 10 條（十分位），每條再切成 10 小格（百分位）。</p>

  <section class="box">
    <h2><span class="n">1</span>用方塊拼小數</h2>
    <div class="stage"><svg id="g" viewBox="0 0 400 200"></svg></div>
    <div class="controls">
      <label>個位 <input type="range" id="o" min="0" max="3" value="2"> <b id="ov"></b></label>
      <label>十分位 <input type="range" id="t" min="0" max="9" value="3"> <b id="tv"></b></label>
      <label>百分位 <input type="range" id="h" min="0" max="9" value="5"> <b id="hv"></b></label>
    </div>
    <div class="work" id="w"></div>
  </section>

  <div class="formula pre">
    <div class="label">記起來</div>
    <div class="big" style="font-size:1.3rem">1 = 10 個 0.1 = 100 個 0.01</div>
    <div class="sub">2.35 = 2 個 1 + 3 個 0.1 + 5 個 0.01</div>
  </div>

  <div class="jh">
    <h2>🎒 國中預告</h2>
    <p>國中會把位值寫成 10 的次方：0.1 = <code>10⁻¹</code>、0.01 = <code>10⁻²</code>（科學記號）。</p>
  </div>

  <section class="box">
    <h2><span class="n">2</span>練習一下</h2>
    <div class="quiz">
      <div class="q" data-hint="十分位是小數點後第 1 位">
        <p class="qt">4.72 的十分位數字是？</p>
        <div class="choices"><button class="choice">4</button><button class="choice" data-right>7</button><button class="choice">2</button></div>
      </div>
      <div class="q" data-answer="36" data-hint="0.36 = 36 個 0.01">
        <p class="qt">0.36 是幾個 0.01？</p>
        <div class="row"><input type="text" inputmode="decimal"> 個 <button class="btn">對答案</button></div>
      </div>
    </div>
  </section>

  <nav class="pager" id="pager"></nav>
</div>
<script src="../assets/lesson.js"></script>
<script>
  const O = document.getElementById("o"), T = document.getElementById("t"), H = document.getElementById("h");
  function draw() {
    const o = +O.value, t = +T.value, h = +H.value, S = 70;
    let s = "", x = 10;
    for (let i = 0; i < o; i++) { s += `<rect x="${x}" y="20" width="${S}" height="${S}" fill="var(--blue)" fill-opacity=".6" stroke="var(--ink)" stroke-width="1.5"/>`; for (let k = 1; k < 10; k++) s += `<line x1="${x + k * 7}" y1="20" x2="${x + k * 7}" y2="${20 + S}" stroke="var(--ink)" stroke-width=".4"/>`; x += S + 8; }
    for (let i = 0; i < t; i++) { s += `<rect x="${x}" y="20" width="7" height="${S}" fill="var(--orange)" fill-opacity=".75" stroke="var(--ink)" stroke-width="1"/>`; x += 9; }
    x += 6;
    for (let i = 0; i < h; i++) s += `<rect x="${x + (i % 3) * 11}" y="${20 + Math.floor(i / 3) * 11}" width="9" height="9" fill="var(--green)" stroke="var(--ink)" stroke-width="1"/>`;
    s += `<text x="10" y="140" font-size="13" style="fill:var(--blue)">大方塊 = 1</text><text x="130" y="140" font-size="13" style="fill:var(--orange)">一條 = 0.1</text><text x="250" y="140" font-size="13" style="fill:var(--green)">一小格 = 0.01</text>`;
    s += `<text x="10" y="180" font-size="24">${o}<tspan style="fill:var(--red)">.</tspan><tspan style="fill:var(--orange)">${t}</tspan><tspan style="fill:var(--green)">${h}</tspan></text>`;
    document.getElementById("g").innerHTML = s;
    document.getElementById("ov").textContent = o; document.getElementById("tv").textContent = t; document.getElementById("hv").textContent = h;
    document.getElementById("w").innerHTML = `${o} 個 1 + ${t} 個 0.1 + ${h} 個 0.01 = <b>${(o + t / 10 + h / 100).toFixed(2)}</b>（也就是 ${o * 100 + t * 10 + h} 個 0.01）`;
  }
  [O, T, H].forEach(x => x.addEventListener("input", draw)); draw();
</script>
</body>
</html>
