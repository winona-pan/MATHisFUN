<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>異分母分數相除</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lesson.css">
</head>
<body data-seq="6a-u2" data-page="6a-u2/03">
<div class="wrap">
  <div class="topbar" id="topbar"></div>

  <span class="kind k-formula">公式怎麼來</span>
  <h1>異分母分數相除</h1>
  <p class="lead">分母不一樣？先通分，變成同分母，再看分子！</p>

  <section class="box">
    <h2><span class="n">1</span>先切成一樣大</h2>
    <div class="controls" style="margin-top:0" id="exs"></div>
    <div class="stage" style="margin-top:12px"><svg id="g" viewBox="0 0 400 200"></svg></div>
    <div class="controls"><button class="btn primary" id="cut" aria-pressed="false">✂ 通分</button></div>
    <div class="work" id="w"></div>
  </section>

  <section class="box" data-steps>
    <h2><span class="n">2</span>公式怎麼來</h2>
    <div class="steps">
      <div class="step"><p>① ¾ ÷ ⅙：格子大小不一樣，看不出「裡面有幾個」。</p></div>
      <div class="step"><p>② <b>通分</b>（分母 4 和 6 的最小公倍數 12）：¾ = 9/12，⅙ = 2/12。</p></div>
      <div class="step"><p>③ 變成同分母：9/12 ÷ 2/12 = 9 ÷ 2 = <b>9/2</b>。</p></div>
    </div>
    <div class="controls"><button class="btn primary" data-next-step></button></div>
  </section>

  <div class="formula">
    <div class="label">方法</div>
    <div class="big" style="font-size:1.35rem">先通分 → 再用分子相除</div>
    <div class="sub">¾ ÷ ⅙ = 9/12 ÷ 2/12 = 9 ÷ 2 = 9/2</div>
  </div>

  <div class="jh">
    <h2>🎒 國中預告</h2>
    <p>下一課會發現一個更快的方法：<b>乘以倒數</b>。國中幾乎都用那個方法，但它就是從今天的通分推出來的。</p>
  </div>

  <section class="box">
    <h2><span class="n">3</span>一直練：隨機出題</h2>
    <div id="prac"></div>
  </section>

  <nav class="pager" id="pager"></nav>
</div>
<script src="../assets/lesson.js"></script>
<script src="../assets/widgets.js"></script>
<script>
  const EX = [[3, 4, 1, 6], [2, 3, 1, 4], [5, 6, 1, 3], [1, 2, 2, 5]];
  let ex = EX[0], cut = false;
  function bar(y, n, d, D, col) {
    let s = "";
    for (let i = 0; i < D; i++) s += `<rect x="${20 + 360 * i / D}" y="${y}" width="${360 / D}" height="40" fill="${i < n * D / d ? col : "var(--card)"}" fill-opacity="${i < n * D / d ? .7 : 1}" stroke="var(--ink)" stroke-width="${D === d ? 1.8 : .8}"/>`;
    for (let i = 0; i <= d; i++) s += `<line x1="${20 + 360 * i / d}" y1="${y}" x2="${20 + 360 * i / d}" y2="${y + 40}" stroke="var(--ink)" stroke-width="2.2"/>`;
    return s;
  }
  function draw() {
    const [a, b, c, d] = ex, L = b * d / W.gcd(b, d), A = a * L / b, C = c * L / d;
    let s = `<text x="20" y="22" font-size="15">${cut ? `${a}/${b} = ${A}/${L}` : `${a}/${b}`}</text>` + bar(30, a, b, cut ? L : b, "var(--blue)");
    s += `<text x="20" y="112" font-size="15">${cut ? `${c}/${d} = ${C}/${L}` : `${c}/${d}`}</text>` + bar(120, c, d, cut ? L : d, "var(--orange)");
    document.getElementById("g").innerHTML = s;
    const r = W.F(A, C);
    document.getElementById("w").innerHTML = cut ? `${A}/${L} ÷ ${C}/${L} = ${A} ÷ ${C} = <b>${W.Fstr(r)}</b>　（藍色裡面有 ${W.Fstr(r)} 個橘色）` : `${a}/${b} ÷ ${c}/${d} = ?　格子不一樣大，先通分！`;
    document.getElementById("cut").setAttribute("aria-pressed", cut);
    document.querySelectorAll("[data-e]").forEach(x => x.setAttribute("aria-pressed", EX[+x.dataset.e] === ex));
  }
  document.getElementById("exs").innerHTML = EX.map((e, i) => `<button class="btn" data-e="${i}">${e[0]}/${e[1]} ÷ ${e[2]}/${e[3]}</button>`).join("");
  document.querySelectorAll("[data-e]").forEach(x => x.addEventListener("click", () => { ex = EX[+x.dataset.e]; cut = false; draw(); }));
  document.getElementById("cut").addEventListener("click", () => { cut = !cut; draw(); });
  draw();

  W.practice(document.getElementById("prac"), { gens: [
    () => { const b = W.pick([2, 3, 4, 5, 6]), d = W.pick([2, 3, 4, 5, 6, 8]), a = W.rand(1, b - 1), c = W.rand(1, d - 1); const L = b * d / W.gcd(b, d), r = W.F(a * L / b, c * L / d);
      return { q: `${a}/${b} ÷ ${c}/${d} = ?`, ans: W.Fval(r), show: W.Fstr(r), hint: `通分成 ${a * L / b}/${L} ÷ ${c * L / d}/${L}`, pic: `<text x="10" y="80" font-size="28">${a}/${b} ÷ ${c}/${d}</text>` }; },
  ] });
</script>
</body>
</html>
