<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學好好玩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8ef;
    --card: #ffffff;
    --ink: #2b2a33;
    --muted: #6b6878;
    --line: #e8e1d3;
    --red: #e4572e;
    --blue: #2e86de;
    --green: #3aa76d;
    --yellow: #f2b632;
    --purple: #8e6bd8;
    --orange: #f08a24;
    --shade: #fde3a7;
    --soft: #e3f0fc;
    --grid: #e6e6ee;
    /* 卡片種類 */
    --k-pre: #f08a24;     --k-pre-soft: #fff0e0;
    --k-word: #8e6bd8;    --k-word-soft: #f0eafc;
    --k-formula: #e4572e; --k-formula-soft: #fde7e1;
    --k-learn: #2e86de;   --k-learn-soft: #e3f0fc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a22; --card: #26252f; --ink: #f2f0f7; --muted: #a9a6b8; --line: #3a3846;
      --shade: #6b5420; --soft: #1d3147; --grid: #3a3846;
      --k-pre-soft: #3a2a17; --k-word-soft: #2c2440; --k-formula-soft: #3d221b; --k-learn-soft: #1d3147;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a22; --card: #26252f; --ink: #f2f0f7; --muted: #a9a6b8; --line: #3a3846;
    --shade: #6b5420; --soft: #1d3147; --grid: #3a3846;
    --k-pre-soft: #3a2a17; --k-word-soft: #2c2440; --k-formula-soft: #3d221b; --k-learn-soft: #1d3147;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", system-ui, sans-serif; line-height: 1.5;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  button { font: inherit; color: inherit; }

  header { text-align: center; padding: 8px 0; }
  header h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 900; margin: 0; letter-spacing: .06em; }
  header h1 .dot { color: var(--red); }
  header p { color: var(--muted); margin: 4px 0 0; font-size: 1.05rem; }

  /* 學期分頁 */
  .tabs { display: flex; justify-content: center; gap: 10px; margin: 20px 0 8px; }
  .tab {
    border: 3px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 8px 26px; font-size: 1.25rem; font-weight: 900; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* 學習地圖 */
  .map { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px; margin: 18px 0 6px; }
  .map a {
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 900; font-size: 1.15rem; text-decoration: none; color: var(--ink);
    border: 3px solid var(--line); background: var(--card); position: relative;
  }
  .map a.done { background: var(--green); border-color: var(--green); color: #fff; }
  .map a.now { background: var(--yellow); border-color: var(--ink); color: #2b2a33; transform: scale(1.15); }
  .map a.next { border-color: var(--yellow); border-style: dashed; }
  .map a.review { width: auto; padding: 0 14px; border-radius: 999px; font-size: .95rem; }
  .map .link { width: 14px; height: 4px; background: var(--line); border-radius: 2px; }
  .map-legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
  .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dotk { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 2px solid var(--line); background: var(--card); }
  .dotk.done { background: var(--green); border-color: var(--green); }
  .dotk.now { background: var(--yellow); border-color: var(--ink); }
  .dotk.next { border-color: var(--yellow); border-style: dashed; }

  /* 篩選 */
  .filters { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 22px 0 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    border: 2px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 5px 14px; font-weight: 700; font-size: .95rem;
  }
  .chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .chip i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  /* 單元 */
  .unit { margin-top: 34px; scroll-margin-top: 16px; }
  .unit-head {
    display: flex; align-items: center; gap: 16px; padding: 12px; border-radius: 20px;
    background: var(--card); border: 3px solid var(--line);
  }
  .unit.now .unit-head { border-color: var(--yellow); box-shadow: 0 0 0 4px rgba(242,182,50,.25); }
  .unit-head .pic { width: 150px; flex: none; aspect-ratio: 4 / 3; background: var(--soft); border-radius: 14px; overflow: hidden; }
  .unit-head .pic svg { width: 100%; height: 100%; display: block; }
  .unit-head .no { font-size: .95rem; font-weight: 700; color: var(--muted); }
  .unit-head h2 { margin: 0; font-size: clamp(1.3rem, 4vw, 1.8rem); font-weight: 900; line-height: 1.25; }
  .status {
    display: inline-block; margin-top: 6px; font-size: .85rem; font-weight: 700;
    padding: 2px 10px; border-radius: 999px; border: 2px solid var(--line); color: var(--muted);
  }
  .status.done { background: var(--green); border-color: var(--green); color: #fff; }
  .status.now { background: var(--yellow); border-color: var(--yellow); color: #2b2a33; }
  .status.next { border-color: var(--yellow); color: var(--ink); }

  .group-title { margin: 16px 4px 8px; font-weight: 900; font-size: 1.05rem; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .group-title small { font-weight: 400; color: var(--muted); font-size: .9rem; }
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); align-items: start; }

  .tile {
    position: relative; display: flex; flex-direction: column; gap: 2px;
    background: var(--card); border: 2px solid var(--line); border-left: 8px solid var(--kc);
    border-radius: 14px; padding: 10px 12px 10px; color: inherit; text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .tile:hover, .tile:focus-visible { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.08); outline: none; }
  .tile .pic { background: var(--ks); border-radius: 10px; aspect-ratio: 4 / 3; margin-bottom: 6px; overflow: hidden; }
  .tile .pic svg { width: 100%; height: 100%; display: block; }
  .tile .kind { align-self: flex-start; font-size: .78rem; font-weight: 700; color: var(--kc); background: var(--ks); padding: 1px 8px; border-radius: 999px; }
  .tile b { font-size: 1.08rem; font-weight: 900; line-height: 1.35; margin-top: 2px; }
  .tile small { color: var(--muted); font-size: .92rem; line-height: 1.4; }
  .tile .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: .8rem; font-weight: 700; gap: 6px; }
  .tile .grade { color: var(--k-pre); }
  .tile .state { color: var(--muted); margin-left: auto; white-space: nowrap; }
  .tile.ready .state { color: var(--green); }
  .tile.soon { cursor: default; }
  .k-pre { --kc: var(--k-pre); --ks: var(--k-pre-soft); }
  .k-word { --kc: var(--k-word); --ks: var(--k-word-soft); }
  .k-formula { --kc: var(--k-formula); --ks: var(--k-formula-soft); }
  .k-learn { --kc: var(--k-learn); --ks: var(--k-learn-soft); }
  .hidden { display: none !important; }
  .unit.dim { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px); opacity: 0;
    background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: 999px;
    font-weight: 700; transition: transform .25s ease, opacity .25s ease; pointer-events: none; z-index: 10;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 560px) {
    .unit-head { flex-direction: column; align-items: stretch; text-align: center; }
    .unit-head .pic { width: 100%; max-width: 260px; margin: 0 auto; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .tile { padding: 8px 9px; border-left-width: 6px; }
    .tile b { font-size: 1rem; }
    .map a { width: 40px; height: 40px; font-size: 1rem; }
    .map .link { width: 8px; }
  }

  /* SVG 共用 */
  svg text { font-family: "Noto Sans TC", system-ui, sans-serif; font-weight: 700; fill: var(--ink); }
  .stroke { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .stroke:not([fill]) { fill: none; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .spin { transform-box: fill-box; transform-origin: center; }
  .tile:hover .spin, .unit-head:hover .spin { animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .roll { transition: transform 1.2s ease-in-out; }
  .tile:hover .roll, .unit-head:hover .roll { transform: translateX(78px); }
  .grow { transform-box: fill-box; transform-origin: left bottom; transition: transform .6s ease; }
  .tile:hover .grow, .unit-head:hover .grow { transform: scale(1.12); }
  .pulse { transform-box: fill-box; transform-origin: center; }
  .tile:hover .pulse, .unit-head:hover .pulse { animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.1); } }
  @media (prefers-reduced-motion: reduce) {
    .tile:hover .spin, .unit-head:hover .spin, .tile:hover .pulse, .unit-head:hover .pulse { animation: none; }
    .roll, .grow, .tile { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>數學好好玩<span class="dot">!</span></h1>
    <p>翰林版・六年級　看圖、動手玩，一步一步學</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-sem="6a">六上</button>
    <button class="tab" role="tab" data-sem="6b">六下</button>
  </div>

  <nav class="map" id="map" aria-label="單元地圖"></nav>
  <div class="map-legend">
    <span><i class="dotk done"></i>學過了</span>
    <span><i class="dotk now"></i>現在學</span>
    <span><i class="dotk next"></i>下一個</span>
    <span><i class="dotk"></i>還沒學</span>
  </div>

  <div class="filters" id="filters">
    <button class="chip" data-k="all" aria-pressed="true">全部</button>
    <button class="chip" data-k="pre" aria-pressed="false"><i style="background:var(--k-pre)"></i>先備知識</button>
    <button class="chip" data-k="word" aria-pressed="false"><i style="background:var(--k-word)"></i>名詞</button>
    <button class="chip" data-k="formula" aria-pressed="false"><i style="background:var(--k-formula)"></i>公式怎麼來</button>
    <button class="chip" data-k="learn" aria-pressed="false"><i style="background:var(--k-learn)"></i>學會方法</button>
  </div>

  <main id="units"></main>
</div>
<div class="toast" id="toast">這一課還在準備中 🛠️</div>

<script>
/* ===========================================================
   目錄資料（翰林版 六上、六下）
   ───────────────────────────────────────────────────────────
   單元 status：done 學過了 / now 現在學 / next 下一個 / later 還沒學
   每張卡片 k（種類）：
     pre     先備知識（以前學過、要先複習的）g = 幾年級學的
     word    名詞定義
     formula 公式怎麼來（重點：讓他看懂公式的由來）
     learn   學會方法、解題
   做好一課：在那張卡片加上 ready: true。
   檔名：先備知識 → review/<id>.html；單元內 → 6a-u7/03.html（不算先備，第幾張）
   =========================================================== */
const SEMESTERS = {
  "6a": {
    name: "六上",
    units: [
      { no: 1, title: "最大公因數與最小公倍數", status: "done", pic: "gcd", items: [
        { k: "pre", t: "因數", h: "能整除的數就是因數", g: "4年級", id: "factors" },
        { k: "pre", t: "倍數", h: "×1、×2、×3…得到的數", g: "4年級", id: "multiples" },
        { k: "pre", t: "公因數、公倍數", h: "兩個數「共同」的因數和倍數", g: "5年級", id: "common-factors" },
        { k: "word", t: "質數與合數", h: "只有 1 和自己當因數的是質數" },
        { k: "learn", t: "質因數分解", h: "把數拆成質數相乘" },
        { k: "formula", t: "短除法為什麼能找最大公因數", h: "一起拿出共同的質數" },
        { k: "learn", t: "用短除法找最小公倍數", h: "外圍的數全部乘起來" },
        { k: "word", t: "互質", h: "最大公因數只有 1" },
        { k: "learn", t: "生活應用", h: "平分用公因數，一起出發用公倍數" },
      ]},
      { no: 2, title: "分數除法", status: "done", pic: "fracdiv", items: [
        { k: "pre", t: "分數的意義", h: "一個東西平分成幾份，拿幾份", g: "3年級", id: "fraction-meaning" },
        { k: "pre", t: "約分與擴分", h: "分子分母同乘、同除，大小不變", g: "4–5年級", id: "equivalent-fractions" },
        { k: "pre", t: "通分", h: "把分母變成一樣", g: "5年級", id: "common-denominator" },
        { k: "pre", t: "分數乘法", h: "分子乘分子，分母乘分母", g: "5年級", id: "fraction-multiply" },
        { k: "learn", t: "分數 ÷ 整數", h: "再平分成幾份" },
        { k: "learn", t: "同分母分數相除", h: "裡面有幾個？看分子就好" },
        { k: "formula", t: "異分母分數相除", h: "先通分，再用分子相除" },
        { k: "word", t: "倒數", h: "分子分母交換位置" },
        { k: "formula", t: "除以分數 = 乘以倒數", h: "為什麼可以這樣算？" },

        { k: "learn", t: "用表格找規律", h: "第幾個 ↔ 有幾個" },
        { k: "formula", t: "第 □ 個有幾個", h: "從第 1 個開始，每次加一樣多" },
        { k: "formula", t: "植樹問題（一條直線）", h: "棵數比間隔數多 1" },
        { k: "learn", t: "圍成一圈", h: "棵數 = 間隔數" },
      ]},
      { no: 4, title: "比與比值", status: "done", pic: "ratio", items: [
        { k: "pre", t: "分數與除法", h: "a ÷ b 可以寫成 a/b", g: "5年級", id: "fraction-and-division" },
        { k: "pre", t: "約分", h: "用最大公因數來約", g: "5年級・六上 1", id: "equivalent-fractions" },
        { k: "word", t: "比", h: "a : b，前項和後項" },
        { k: "word", t: "比值", h: "前項 ÷ 後項" },
        { k: "formula", t: "相等的比", h: "前後項同乘、同除，比值不變" },
        { k: "word", t: "最簡整數比", h: "不能再約的整數比" },
        { k: "learn", t: "小數、分數的比", h: "先化成整數比" },
      ]},
      { no: 5, title: "小數除法", status: "done", pic: "decdiv", items: [
        { k: "pre", t: "小數的位值", h: "個位、十分位、百分位", g: "3–4年級", id: "decimal-place-value" },

        { k: "learn", t: "小數 ÷ 整數", h: "商的小數點對齊往上點" },
        { k: "formula", t: "除數是小數怎麼辦", h: "兩個數一起 ×10，商不變" },
        { k: "learn", t: "餘數的小數點", h: "跟著原來的小數點" },
        { k: "learn", t: "商取概數", h: "四捨五入到第幾位" },
        { k: "learn", t: "答案變大還是變小", h: "除以比 1 小的數，答案變大" },
      ]},
      { no: 6, title: "兩量關係與比", status: "done", pic: "twoQty", items: [

        { k: "pre", t: "用表格整理數量", h: "一欄一欄看變化", g: "4–5年級", id: "tables" },

      { no: 7, title: "圓周長與扇形周長", status: "now", pic: "parts", items: [

        { k: "word", t: "圓周長", h: "沿著圓走一圈的長度", pic: "perimeterWalk", ready: true },
        { k: "formula", t: "圓周率 π 怎麼來", h: "滾一圈 ≈ 直徑的 3.14 倍", pic: "pi", ready: true },
        { k: "formula", t: "圓周長公式", h: "直徑 × 3.14", pic: "circumference", ready: true },
        { k: "word", t: "扇形、圓心角、弧", h: "像一片披薩", pic: "sector", ready: true },
        { k: "formula", t: "弧長怎麼算", h: "圓周長 × 圓心角 / 360", pic: "arc", ready: true },

/* ---------- 插圖（viewBox 160 x 120） ---------- */
function gridLines(w, h, step) {
  let s = "";
  for (let x = step; x < w; x += step) s += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" class="gridline"/>`;
  for (let y = step; y < h; y += step) s += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" class="gridline"/>`;
  return s;
}
function wedges(cx, cy, r, n) {
  return Array.from({ length: n }, (_, i) => {
    const a1 = i * 2 * Math.PI / n, a2 = (i + 1) * 2 * Math.PI / n;
    const p = a => `${(cx + r * Math.cos(a)).toFixed(1)} ${(cy + r * Math.sin(a)).toFixed(1)}`;
    return `<path d="M${cx} ${cy} L${p(a1)} A${r} ${r} 0 0 1 ${p(a2)} Z" fill="${i % 2 ? "var(--yellow)" : "var(--blue)"}" stroke="var(--ink)" stroke-width="1.5"/>`;
  }).join("");
}
const dots = (pts, color) => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="6" fill="${color}"/>`).join("");
const arrow = (x, y) => `<path d="M${x} ${y} l14 0" class="stroke"/><path d="M${x + 9} ${y - 5} l5 5 l-5 5" class="stroke"/>`;

/* ---------- 畫面 ---------- */
const $ = s => document.querySelector(s);
let currentSem = "6a";
let currentKind = "all";
try { currentSem = localStorage.getItem("sem") || currentSem; } catch (e) {}
if (!SEMESTERS[currentSem]) currentSem = "6a";
// 從課程頁按「← 目錄」回來時（例如 #6a-u7），切到那個學期
const hashSem = location.hash.slice(1).split("-")[0];
if (SEMESTERS[hashSem]) currentSem = hashSem;

const svg = name => `<svg viewBox="0 0 160 120" aria-hidden="true">${PICS[name] || ""}</svg>`;

function tile(item, unit, num) {
  const href = item.href || (item.k === "pre"
    ? `review/${item.id}.html?u=${currentSem}-u${unit.no}`
    : `${currentSem}-u${unit.no}/${String(num).padStart(2, "0")}.html`);
  const ready = !!item.ready;
  return `
    <a class="tile k-${item.k} ${ready ? "ready" : "soon"}" data-k="${item.k}" href="${ready ? href : "#"}" ${ready ? "" : 'data-soon="1"'}>
      ${item.pic ? `<div class="pic">${svg(item.pic)}</div>` : ""}
      <span class="kind">${KIND_LABEL[item.k]}</span>
      <b>${item.t}</b>
      <small>${item.h}</small>
      <span class="foot">
        ${item.g ? `<span class="grade">${item.g}</span>` : ""}
        <span class="state">${ready ? "開始玩 →" : "準備中"}</span>
      </span>
    </a>`;
}

function render() {
  const sem = SEMESTERS[currentSem];
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.sem === currentSem));

  $("#map").innerHTML = sem.units.map((u, i) => `
    ${i ? '<span class="link"></span>' : ""}
    <a href="#${currentSem}-u${u.no}" class="${u.status} ${u.review ? "review" : ""}" title="${u.title}（${STATUS_LABEL[u.status]}）">${u.review ? "總複習" : u.no}</a>`).join("");

  $("#units").innerHTML = sem.units.map(u => {
    const indexed = u.items.map((it, i) => [it, i]);
    const pre = indexed.filter(([it]) => it.k === "pre");
    const main = indexed.filter(([it]) => it.k !== "pre");
    return `
    <section class="unit ${u.status}" id="${currentSem}-u${u.no}">
      <div class="unit-head">
        <div class="pic">${svg(u.pic)}</div>
        <div>
          <div class="no">${sem.name}${u.review ? "" : ` 第 ${u.no} 單元`}</div>
          <h2>${u.title}</h2>
          <span class="status ${u.status}">${STATUS_LABEL[u.status]}</span>
        </div>
      </div>
      ${pre.length ? `
        <div data-group>
          <div class="group-title" style="color:var(--k-pre)">先複習 <small>以前學過的，忘了就點進去看</small></div>
          <div class="tiles">${pre.map(([it]) => tile(it, u)).join("")}</div>
        </div>` : ""}
      <div data-group>
        <div class="group-title">這個單元 <small>照順序一張一張學</small></div>
        <div class="tiles">${main.map(([it], j) => tile(it, u, j + 1)).join("")}</div>
      </div>
    </section>`;
  }).join("");
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll("#filters .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.k === currentKind));
  document.querySelectorAll(".tile").forEach(t => t.classList.toggle("hidden", currentKind !== "all" && t.dataset.k !== currentKind));
  document.querySelectorAll("[data-group]").forEach(g => g.classList.toggle("hidden", !g.querySelector(".tile:not(.hidden)")));
  document.querySelectorAll(".unit").forEach(u => u.classList.toggle("dim", !u.querySelector(".tile:not(.hidden)")));
}

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  currentSem = t.dataset.sem;
  try { localStorage.setItem("sem", currentSem); } catch (e) {}
  render();
}));
$("#filters").addEventListener("click", e => {
  const c = e.target.closest(".chip");
  if (!c) return;
  currentKind = c.dataset.k;
  applyFilter();
});

const toast = $("#toast");
let timer;
$("#units").addEventListener("click", e => {
  if (!e.target.closest("[data-soon]")) return;
  e.preventDefault();
  toast.classList.add("show");
  clearTimeout(timer);
  timer = setTimeout(() => toast.classList.remove("show"), 1600);
});

render();
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
</script>
