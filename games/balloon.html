<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>射氣球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lesson.css">
<link rel="stylesheet" href="game.css">
<style>
  .qbar { display: flex; gap: 10px; align-items: center; background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 8px 10px; margin-bottom: 8px; min-height: 76px; }
  .qbar .pic { flex: none; width: 96px; background: var(--soft); border-radius: 10px; }
  .qbar .pic svg { width: 100%; height: auto; display: block; }
  .qbar .q { margin: 0; font-weight: 900; font-size: 1.1rem; line-height: 1.4; }
  .arena { position: relative; height: clamp(380px, 62vh, 600px); border-radius: 20px; overflow: hidden; touch-action: manipulation;
    background: linear-gradient(#bfe3ff, #eaf6ff 70%, #c9ecc4 70%, #a8dd9f); border: 3px solid var(--line); }
  .cloud { position: absolute; background: #fff; border-radius: 999px; opacity: .85; }
  .bal { position: absolute; top: 0; width: 84px; height: 120px; margin-left: -42px; border: 0; padding: 0; background: none; cursor: pointer; will-change: transform; }
  .bal svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .bal span { position: absolute; left: 0; right: 0; top: 24px; text-align: center; color: #fff; font-weight: 900; font-size: 1.15rem; line-height: 1.1;
    text-shadow: 0 1px 0 rgba(0,0,0,.45), 0 0 4px rgba(0,0,0,.35); pointer-events: none; }
  .bal span small { display: block; font-size: .7rem; }
  .bal.popped { pointer-events: none; animation: popa .35s forwards; }
  .bal.bad { pointer-events: none; animation: bad .5s forwards; }
  @keyframes popa { to { opacity: 0; scale: 1.6; } }
  @keyframes bad { 30% { rotate: -12deg; } 60% { rotate: 12deg; } to { opacity: 0; translate: 0 60px; } }
  .msg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--card); border: 3px solid var(--ink); border-radius: 16px;
    padding: 8px 18px; font-weight: 900; font-size: 1.2rem; text-align: center; pointer-events: none; z-index: 5; }
  .speeds { display: flex; gap: 8px; flex-wrap: wrap; }
  .hearts { letter-spacing: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="gtop"><a href="index.html">← 小遊戲</a><a href="../index.html">目錄</a></div>

  <section class="screen" id="s-start">
    <h1>🎈 射氣球</h1>
    <p class="lead">氣球往上飄，點寫著<b>正確答案</b>的氣球把它戳破！點錯或讓正確的氣球飛走，就會少一顆 ❤️。</p>
    <div class="box"><h2>選主題</h2><div id="topics"></div>
      <h2 style="margin-top:16px">速度</h2>
      <div class="speeds" id="speeds"><button class="topic" data-s="slow">🐢 慢慢來</button><button class="topic" data-s="mid">🐇 普通</button><button class="topic" data-s="fast">🚀 很快</button></div>
    </div>
    <button class="go" id="go">開始！</button>
    <p class="bestline" id="best"></p>
  </section>

  <section class="screen" id="s-play" hidden>
    <div class="hud"><span>🎈 <span id="score">0</span></span><span class="combo" id="combo"></span><span class="grow"></span><span class="hearts" id="hearts"></span></div>
    <div class="qbar"><div class="pic" id="pic"><svg viewBox="0 0 220 150"></svg></div><p class="q" id="q"></p></div>
    <div class="arena" id="arena"></div>
  </section>

  <section class="screen result" id="s-end" hidden>
    <h1>遊戲結束</h1>
    <div class="stars" id="stars"></div>
    <div class="big" id="final"></div>
    <div id="rec"></div>
    <button class="go" id="again">再玩一次</button>
    <button class="go alt" id="change">換主題・速度</button>
    <div class="box" style="margin-top:20px" id="review"></div>
  </section>
</div>
<script src="../assets/lesson.js"></script>
<script src="../assets/widgets.js"></script>
<script src="../assets/gens.js"></script>
<script src="../assets/fun.js"></script>
<script src="game.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const SPEED = { slow: 18, mid: 12, fast: 8 }; // 從下面飄到上面要幾秒
  const COL = ["#e4572e", "#2e86de", "#3aa76d", "#8e6bd8", "#f08a24"];
  let topics = [], speed = "slow", score, combo, hearts, cur, misses, balloons = [], raf, last, roundOver, factor;
  try { speed = localStorage.getItem("mif-balloon-speed") || speed; } catch (e) {}
  const show = id => document.querySelectorAll(".screen").forEach(s => s.hidden = s.id !== id);
  const key = () => speed + ":" + GAME.topicKey(topics);
  function bestLine() { const b = GAME.best("balloon", key()); $("best").textContent = b !== undefined ? `🏆 最多戳破：${b} 顆` : "這組還沒有紀錄"; }
  const picker = GAME.topicPicker($("topics"), ids => { topics = ids; bestLine(); });
  function paintSpeed() { document.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", b.dataset.s === speed)); bestLine(); }
  $("speeds").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (!b) return; speed = b.dataset.s; try { localStorage.setItem("mif-balloon-speed", speed); } catch (e) {} paintSpeed(); });
  paintSpeed();

  const balloonSVG = c => `<svg viewBox="0 0 84 120"><path d="M42 84 q-4 14 2 22 q6 8 -2 14" fill="none" stroke="#777" stroke-width="1.5"/>
    <ellipse cx="42" cy="42" rx="38" ry="42" fill="${c}"/><ellipse cx="28" cy="24" rx="8" ry="12" fill="#fff" opacity=".35"/><path d="M36 82 l6 6 l6 -6 Z" fill="${c}"/></svg>`;

  function hud() {
    $("score").textContent = score;
    $("combo").textContent = combo >= 2 ? `🔥 ${combo}` : "";
    $("hearts").textContent = "❤️".repeat(hearts) + "🤍".repeat(3 - hearts);
  }
  function msg(t, ms = 1000) {
    const m = document.createElement("div"); m.className = "msg"; m.innerHTML = t; $("arena").appendChild(m);
    setTimeout(() => m.remove(), ms);
  }
  function round() {
    cur = GAME.question(topics);
    $("q").innerHTML = cur.q;
    $("pic").style.display = cur.pic ? "" : "none";
    $("pic").firstElementChild.setAttribute("viewBox", cur.viewBox || "0 0 220 150");
    $("pic").firstElementChild.innerHTML = cur.pic || "";
    const A = $("arena"), H = A.clientHeight, n = cur.opts.length;
    A.querySelectorAll(".bal").forEach(b => b.remove());
    const cols = cur.opts.map((_, i) => i).sort(() => Math.random() - .5);
    balloons = cur.opts.map((o, i) => {
      const b = document.createElement("button");
      b.className = "bal"; b.dataset.i = i;
      b.style.left = `${(cols[i] + 0.5) / n * 100}%`;
      b.innerHTML = balloonSVG(COL[(i + score) % COL.length]) + `<span>${o}<small>${cur.unit}</small></span>`;
      A.appendChild(b);
      return { el: b, i, y: H + 10 + Math.random() * 80, wob: Math.random() * 6.28, alive: true };
    });
    roundOver = false;
  }
  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    const H = $("arena").clientHeight, v = (H + 140) / (SPEED[speed] * factor);
    balloons.forEach(b => {
      if (!b.alive) return;
      b.y -= v * dt; b.wob += dt * 2;
      b.el.style.transform = `translate(${Math.sin(b.wob) * 6}px, ${b.y}px)`;
      if (b.y < -125) {
        b.alive = false;
        if (b.i === cur.ans && !roundOver) miss("飛走了！");
      }
    });
    if (!roundOver && balloons.every(b => !b.alive)) round();
    raf = requestAnimationFrame(loop);
  }
  function miss(why) {
    roundOver = true; combo = 0; hearts--;
    misses.push(cur);
    GAME.fun("no");
    msg(`${why}<br>答案是 <span style="color:var(--green)">${cur.opts[cur.ans]} ${cur.unit}</span>`, 1400);
    balloons.forEach(b => { if (b.alive) { b.alive = false; b.el.classList.add(b.i === cur.ans ? "popped" : "bad"); } });
    hud();
    if (hearts <= 0) setTimeout(end, 1400); else setTimeout(round, 1400);
  }
  $("arena").addEventListener("pointerdown", e => {
    const el = e.target.closest(".bal"); if (!el || roundOver) return;
    const b = balloons.find(x => x.el === el); if (!b || !b.alive) return;
    b.alive = false;
    if (b.i === cur.ans) {
      el.classList.add("popped");
      score++; combo++; factor = Math.max(0.55, factor * 0.96);
      roundOver = true;
      GAME.fun(combo % 5 === 0 ? "streak" : "pop2");
      if (combo % 5 === 0) msg(`🔥 連續 ${combo} 顆！`, 900);
      balloons.forEach(x => { if (x.alive) { x.alive = false; x.el.classList.add("bad"); } });
      hud();
      setTimeout(round, 450);
    } else {
      el.classList.add("bad");
      miss("戳錯了！");
    }
  });
  function start() {
    score = 0; combo = 0; hearts = 3; misses = []; factor = 1;
    show("s-play"); hud();
    requestAnimationFrame(() => { round(); last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); });
  }
  function end() {
    cancelAnimationFrame(raf);
    show("s-end");
    const stars = score >= 15 ? 3 : score >= 8 ? 2 : score >= 3 ? 1 : 0;
    $("stars").textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
    $("final").textContent = `戳破 ${score} 顆`;
    const r = GAME.record("balloon", key(), score);
    $("rec").innerHTML = r.isNew && score > 0 ? `<span class="newrec">🏆 新紀錄！</span>` : r.old !== undefined ? `<p class="bestline">最多：${Math.max(r.old, score)} 顆</p>` : "";
    if (r.isNew && score > 0) { GAME.fun("done"); FUN.confetti(); } else GAME.fun("lose");
    $("review").innerHTML = GAME.review(misses);
    scrollTo(0, 0);
  }
  $("go").addEventListener("click", start);
  $("again").addEventListener("click", start);
  $("change").addEventListener("click", () => { show("s-start"); topics = picker.get(); bestLine(); });
  // 背景的雲
  [[8, 10, 70], [60, 22, 90], [30, 45, 56]].forEach(([x, y, w]) => { const c = document.createElement("div"); c.className = "cloud"; c.style.cssText = `left:${x}%;top:${y}%;width:${w}px;height:${w * .4}px`; $("arena").appendChild(c); });
  window.__game = { get cur() { return cur; }, get balloons() { return balloons; }, get hearts() { return hearts; }, get score() { return score; } };
</script>
</body>
</html>
