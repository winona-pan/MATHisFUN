<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心算練功房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lesson.css">
<link rel="stylesheet" href="game.css">
<style>
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row .topic { flex: 1 1 140px; }
  .tables { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .tables .topic { text-align: center; padding: 8px 0; font-size: 1.2rem; }
  .tables .topic::before { content: none; }
  /* 弱點地圖 */
  .heat { display: grid; grid-template-columns: 26px repeat(9, minmax(0, 1fr)); gap: 3px; font-weight: 900; font-size: .85rem; text-align: center; }
  .heat > span { display: grid; place-items: center; color: var(--muted); }
  .heat button { aspect-ratio: 1; border: 0; border-radius: 6px; font: inherit; font-weight: 900; font-size: clamp(.7rem, 2.6vw, .95rem); cursor: pointer; color: #2b2a33; padding: 0; }
  .h0 { background: var(--line); color: var(--muted) !important; } .h1 { background: #f6a28c; } .h2 { background: #f7d27a; } .h3 { background: #8fd3a9; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .85rem; font-weight: 700; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }
  /* 作答 */
  .qbig { text-align: center; font-size: clamp(2.6rem, 13vw, 4.4rem); font-weight: 900; line-height: 1.1; margin: 6px 0; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .qbig .ans { display: inline-block; min-width: 1.6em; border-bottom: 5px solid var(--ink); color: var(--blue); }
  .qbig.ok .ans { color: var(--green); border-color: var(--green); }
  .qbig.no .ans { color: var(--red); border-color: var(--red); text-decoration: line-through; }
  .speed { text-align: center; font-weight: 900; min-height: 1.6em; font-size: 1.15rem; }
  .qtime { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; max-width: 360px; margin: 0 auto; }
  .qtime b { display: block; height: 100%; width: 0; background: var(--green); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 360px; margin: 12px auto 0; }
  .pad button { border: 3px solid var(--line); background: var(--card); color: var(--ink); border-radius: 16px; font: inherit; font-size: 1.8rem; font-weight: 900; padding: 10px 0; cursor: pointer; box-shadow: 0 4px 0 var(--line); touch-action: manipulation; }
  .pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .pad .k-ok { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 4px 0 #2a7d51; }
  .help { background: var(--card); border: 3px solid var(--red); border-radius: 18px; padding: 10px; margin-top: 12px; text-align: center; }
  .help svg { width: 100%; max-width: 380px; height: auto; display: block; margin: 0 auto; }
  .help p { margin: 4px 0; font-weight: 900; }
  .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .sum div { background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 8px; font-weight: 700; color: var(--muted); font-size: .85rem; }
  .sum b { display: block; font-size: 1.6rem; color: var(--ink); }
  .factpic { margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="gtop"><a href="index.html">← 小遊戲</a><a href="../index.html">目錄</a></div>

  <section class="screen" id="s-start">
    <h1>🥋 心算練功房</h1>
    <p class="lead">九九乘法、除法練到「一看就知道」！越快答對，格子越綠。</p>

    <div class="box">
      <h2>1. 練什麼</h2>
      <div class="row" id="kinds">
        <button class="topic" data-k="mul">✖️ 九九乘法<small>7 × 8</small></button>
        <button class="topic" data-k="div">➗ 除法<small>56 ÷ 7（九九反過來）</small></button>
        <button class="topic" data-k="tens">0️⃣ 整十整百<small>40 × 6、320 ÷ 8</small></button>
        <button class="topic" data-k="two">🔢 二位數 × 一位數<small>23 × 4</small></button>
      </div>
      <h2 style="margin-top:14px">2. 幾的乘法</h2>
      <div class="tables" id="tables"></div>
      <h2 style="margin-top:14px">3. 怎麼玩</h2>
      <div class="row" id="modes">
        <button class="topic" data-m="practice">🐢 練習 20 題<small>不計時，答錯看圖</small></button>
        <button class="topic" data-m="timed">⏱️ 60 秒挑戰<small>能答對幾題？</small></button>
      </div>
    </div>
    <button class="go" id="go">開始！</button>
    <p class="bestline" id="best"></p>

    <div class="box">
      <h2>🗺️ 我的九九地圖</h2>
      <p style="margin:0 0 8px;color:var(--muted);font-weight:700">每一格是一個乘法。點格子可以看圖。練越多次，顏色越準。</p>
      <div class="heat" id="heat"></div>
      <div class="legend"><span><i class="h3"></i>3 秒內答對</span><span><i class="h2"></i>有點慢</span><span><i class="h1"></i>很慢或答錯</span><span><i class="h0"></i>還沒練</span></div>
      <div class="factpic" id="factpic"></div>
    </div>
  </section>

  <section class="screen" id="s-play" hidden>
    <div class="hud"><span id="prog"></span><span class="combo" id="combo"></span><span class="grow"></span><span id="clock"></span></div>
    <div class="timebar" id="tbar"><b id="bar" style="width:100%"></b></div>
    <div class="qbig" id="qbig"></div>
    <div class="qtime"><b id="qt"></b></div>
    <div class="speed" id="speed"></div>
    <div id="help"></div>
    <div class="pad" id="pad"></div>
  </section>

  <section class="screen result" id="s-end" hidden>
    <h1 id="etitle"></h1>
    <div class="stars" id="stars"></div>
    <div class="sum" id="sum"></div>
    <div id="rec" style="margin-top:10px"></div>
    <button class="go" id="again">再練一次</button>
    <button class="go alt" id="back">回到選單</button>
    <div class="box" style="margin-top:16px" id="slow"></div>
  </section>
</div>
<script src="../assets/fun.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const fun = (n, a) => window.FUN && FUN.play(n, a);
  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];

  /* ---------- 設定（記在這台裝置） ---------- */
  const SKEY = "mif-mental";
  let set = { kinds: ["mul"], tables: [2, 3, 4, 5, 6, 7, 8, 9], mode: "practice" };
  try { Object.assign(set, JSON.parse(localStorage.getItem(SKEY)) || {}); } catch (e) {}
  const saveSet = () => { try { localStorage.setItem(SKEY, JSON.stringify(set)); } catch (e) {} };

  /* ---------- 每個九九的紀錄：n 次、ok 次、t 平均秒數、last 最後一次對不對 ---------- */
  const FKEY = "mif-facts";
  let facts = {};
  try { facts = JSON.parse(localStorage.getItem(FKEY)) || {}; } catch (e) {}
  const fkey = (a, b) => `${Math.min(a, b)}x${Math.max(a, b)}`;
  function note(a, b, ok, sec) {
    const k = fkey(a, b), f = facts[k] || { n: 0, ok: 0, t: 0, last: 1 };
    f.n++; f.last = ok ? 1 : 0;
    if (ok) { f.ok++; f.t = f.t ? f.t * 0.6 + Math.min(sec, 15) * 0.4 : Math.min(sec, 15); }
    facts[k] = f;
    try { localStorage.setItem(FKEY, JSON.stringify(facts)); } catch (e) {}
  }
  // 0 還沒練、1 很慢或答錯、2 有點慢、3 很快
  function heatOf(a, b) {
    const f = facts[fkey(a, b)];
    if (!f || !f.n) return 0;
    if (!f.last || !f.ok || f.t > 6) return 1;
    return f.t > 3 ? 2 : 3;
  }
  // 越不熟的越常出現
  function weight(a, b) {
    const f = facts[fkey(a, b)];
    if (!f || !f.n) return 3;
    return 1 + (f.last ? 0 : 4) + (1 - f.ok / f.n) * 3 + Math.max(0, f.t - 2);
  }
  function pickFact() {
    const list = [];
    set.tables.forEach(a => { for (let b = 1; b <= 9; b++) list.push([a, b, weight(a, b) * (b === 1 ? 0.3 : 1)]); });
    let r = Math.random() * list.reduce((s, x) => s + x[2], 0);
    for (const x of list) { r -= x[2]; if (r <= 0) return [x[0], x[1]]; }
    return list[0];
  }

  /* ---------- 出題 ---------- */
  function makeQ() {
    const k = pick(set.kinds);
    if (k === "two") {
      const a = rand(11, 49), b = pick(set.tables);
      if (a % 10 === 0) return makeQ();
      return { k, text: `${a} × ${b}`, ans: a * b, a, b };
    }
    const [a, b] = pickFact();
    if (k === "mul") return { k, text: `${a} × ${b}`, ans: a * b, fact: [a, b] };
    if (k === "div") return { k, text: `${a * b} ÷ ${a}`, ans: b, fact: [a, b] };
    // 整十整百
    const z = pick([10, 10, 100]);
    return Math.random() < 0.5
      ? { k, text: `${a * z} × ${b}`, ans: a * b * z, fact: [a, b], z, op: "×" }
      : { k, text: `${a * b * z} ÷ ${a}`, ans: b * z, fact: [a, b], z, op: "÷" };
  }

  /* ---------- 看圖：點點陣列 / 拆開來乘 ---------- */
  function dots(a, b, mode) {
    // a 排、每排 b 個
    const cell = Math.min(34, 300 / Math.max(b, 1)), r = cell * 0.36, W = b * cell + 90, H = a * cell + 16;
    let s = `<svg viewBox="0 0 ${W} ${H}">`;
    for (let i = 0; i < a; i++) {
      const y = 8 + i * cell + cell / 2;
      s += `<rect x="2" y="${8 + i * cell + 2}" width="${b * cell}" height="${cell - 4}" rx="${cell / 2 - 2}" fill="${i % 2 ? "#e3f0fc" : "#fff3d1"}"/>`;
      for (let j = 0; j < b; j++) s += `<circle cx="${2 + j * cell + cell / 2}" cy="${y}" r="${r}" fill="${mode === "div" && j === b - 1 ? "#e4572e" : "#2e86de"}"/>`;
      s += `<text x="${b * cell + 12}" y="${y + 6}" font-size="${Math.min(18, cell * 0.6)}" font-weight="900" fill="${i === a - 1 ? "#e4572e" : "#6b6878"}">${(i + 1) * b}</text>`;
    }
    return s + "</svg>";
  }
  function helpHTML(q) {
    if (q.k === "two") {
      const t = Math.floor(q.a / 10) * 10, u = q.a % 10, b = q.b, W = 320, tw = t / q.a * 260;
      return `<p>把 ${q.a} 拆成 ${t} 和 ${u}，分開乘再加起來</p><svg viewBox="0 0 ${W} 130">
        <rect x="30" y="20" width="${tw}" height="70" fill="#fff3d1" stroke="#2b2a33" stroke-width="2"/><rect x="${30 + tw}" y="20" width="${260 - tw}" height="70" fill="#e3f0fc" stroke="#2b2a33" stroke-width="2"/>
        <text x="${30 + tw / 2}" y="62" text-anchor="middle" font-size="18" font-weight="900">${t}×${b}=${t * b}</text><text x="${30 + tw + (260 - tw) / 2}" y="62" text-anchor="middle" font-size="16" font-weight="900">${u}×${b}=${u * b}</text>
        <text x="${30 + tw / 2}" y="14" text-anchor="middle" font-size="14" font-weight="700" fill="#6b6878">${t}</text><text x="${30 + tw + (260 - tw) / 2}" y="14" text-anchor="middle" font-size="14" font-weight="700" fill="#6b6878">${u}</text>
        <text x="16" y="60" font-size="14" font-weight="700" fill="#6b6878">${b}</text>
        <text x="160" y="120" text-anchor="middle" font-size="18" font-weight="900" fill="#e4572e">${t * b} + ${u * b} = ${q.ans}</text></svg>`;
    }
    const [a, b] = q.fact;
    if (q.k === "div") return `<p>${a * b} 個點平分成 ${a} 排，每排 <span style="color:var(--red)">${b}</span> 個</p>${dots(a, b, "div")}<p>想乘法：${a} × <span style="color:var(--red)">${b}</span> = ${a * b}，所以 ${a * b} ÷ ${a} = ${b}</p>`;
    if (q.k === "tens") return `<p>先算 ${q.op === "×" ? `${a} × ${b} = ${a * b}` : `${a * b} ÷ ${a} = ${b}`}，再在後面補 ${q.z === 10 ? "1" : "2"} 個 0</p>${dots(a, b)}<p style="color:var(--red)">${q.text} = ${q.ans}</p>`;
    return `<p>${a} 排、每排 ${b} 個，一排一排數：${Array.from({ length: a }, (_, i) => (i + 1) * b).join("、")}</p>${dots(a, b)}<p style="color:var(--red)">${a} × ${b} = ${a * b}</p>`;
  }

  /* ---------- 選單 ---------- */
  function paintMenu() {
    document.querySelectorAll("[data-k]").forEach(b => b.setAttribute("aria-pressed", set.kinds.includes(b.dataset.k)));
    $("tables").innerHTML = [2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="topic" data-t="${n}" aria-pressed="${set.tables.includes(n)}">${n}</button>`).join("");
    document.querySelectorAll("[data-m]").forEach(b => b.setAttribute("aria-pressed", set.mode === b.dataset.m));
    const best = window.GAMEBEST();
    $("best").textContent = set.mode === "timed" ? (best !== undefined ? `🏆 這個組合 60 秒最多答對 ${best} 題` : "這個組合還沒有紀錄") : avgLine();
    let h = `<span>×</span>` + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<span>${n}</span>`).join("");
    for (let a = 1; a <= 9; a++) { h += `<span>${a}</span>`; for (let b = 1; b <= 9; b++) h += `<button class="h${heatOf(a, b)}" data-f="${a},${b}" title="${a} × ${b}">${a * b}</button>`; }
    $("heat").innerHTML = h;
  }
  function avgLine() {
    const ks = set.tables.flatMap(a => [1, 2, 3, 4, 5, 6, 7, 8, 9].map(b => facts[fkey(a, b)]).filter(f => f && f.ok));
    if (!ks.length) return "";
    const avg = ks.reduce((s, f) => s + f.t, 0) / ks.length;
    return `這幾個乘法平均 ${avg.toFixed(1)} 秒答對一題`;
  }
  window.GAMEBEST = () => { try { return ((JSON.parse(localStorage.getItem("mif-games")) || {}).mental || {})[comboKey()]; } catch (e) {} };
  const comboKey = () => set.kinds.slice().sort().join("+") + ":" + set.tables.join("");
  $("kinds").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b) return; const k = b.dataset.k;
    if (set.kinds.includes(k)) { if (set.kinds.length > 1) set.kinds = set.kinds.filter(x => x !== k); } else set.kinds.push(k); saveSet(); paintMenu(); });
  $("tables").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; const n = +b.dataset.t;
    if (set.tables.includes(n)) { if (set.tables.length > 1) set.tables = set.tables.filter(x => x !== n); } else set.tables = [...set.tables, n].sort(); saveSet(); paintMenu(); });
  $("modes").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (!b) return; set.mode = b.dataset.m; saveSet(); paintMenu(); });
  $("heat").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; const [a, c] = b.dataset.f.split(",").map(Number);
    const f = facts[fkey(a, c)];
    $("factpic").innerHTML = `<div class="help" style="border-color:var(--blue)">${helpHTML({ k: "mul", fact: [a, c] })}<p style="color:var(--muted)">${f && f.n ? `練過 ${f.n} 次，答對 ${f.ok} 次${f.ok ? `，平均 ${f.t.toFixed(1)} 秒` : ""}` : "還沒練過"}</p></div>`; });

  /* ---------- 遊戲 ---------- */
  const N_PRACTICE = 20, SECS = 60;
  let q, typed = "", lastOk = false, waitAt = 0, t0, done, right, combo, times, slowList, left, timer, qtimer, waiting, retry, startXP;
  function show(id) { document.querySelectorAll(".screen").forEach(s => s.hidden = s.id !== id); }
  $("pad").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, "⌫", 0, "✓"].map(k => `<button data-key="${k}" class="${k === "✓" ? "k-ok" : ""}">${k}</button>`).join("");
  $("pad").addEventListener("click", e => { const b = e.target.closest("[data-key]"); if (b) key(b.dataset.key); });
  document.addEventListener("keydown", e => {
    if ($("s-play").hidden) return;
    if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === "Backspace") key("⌫"); else if (e.key === "Enter") key("✓");
  });
  function key(k) {
    if (waiting) {
      // 答對後馬上打下一題的數字也可以（不用等）
      // 答錯時先停一下，避免順手按 ✓ 就跳過看圖
      if (!lastOk && performance.now() - waitAt < 1500) return;
      if (k === "✓" || (lastOk && /^[0-9]$/.test(k))) nextQ();
      if (k === "✓" || waiting || $("s-play").hidden) return;
    }
    if (k === "⌫") typed = typed.slice(0, -1);
    else if (k === "✓") { if (typed) check(); return; }
    else if (typed.length < 5) typed += k;
    paintQ();
    // 位數夠了就自動對答案
    if (typed.length >= String(q.ans).length) check();
  }
  function paintQ(cls = "") {
    $("qbig").className = "qbig " + cls;
    $("qbig").innerHTML = `${q.text} = <span class="ans">${typed || "&nbsp;"}</span>`;
  }
  function nextQ() {
    waiting = false;
    $("help").innerHTML = ""; $("speed").textContent = "";
    if (set.mode === "practice" && done >= N_PRACTICE) return end();
    // 答錯的題目過 3 題再考一次
    if (retry.length && retry[0].at <= done) q = retry.shift().q; else q = makeQ();
    typed = ""; paintQ(); t0 = performance.now();
    hud();
  }
  function check() {
    const sec = (performance.now() - t0) / 1000, ok = +typed === q.ans;
    if (q.fact) note(q.fact[0], q.fact[1], ok, sec);
    done++;
    lastOk = ok; waitAt = performance.now();
    if (ok) {
      right++; combo++; times.push(sec);
      if (sec > 4 && q.fact) slowList.push([q.text, q.ans, sec]);
      paintQ("ok");
      $("speed").innerHTML = sec < 3 ? `<span style="color:var(--green)">⚡ ${sec.toFixed(1)} 秒！</span>` : sec < 6 ? `<span style="color:var(--orange)">✓ ${sec.toFixed(1)} 秒</span>` : `<span style="color:var(--muted)">✓ ${sec.toFixed(1)} 秒，再快一點點</span>`;
      fun(combo % 10 === 0 ? "streak" : "ok");
      window.FUN && FUN.gain(sec < 3 ? 2 : 1, "game", `心算 ${q.text}`);
      waiting = true; hud();
      setTimeout(() => { if (waiting && !$("s-play").hidden) nextQ(); }, sec < 3 ? 350 : 550);
    } else {
      combo = 0; fun("no");
      if (q.fact) slowList.push([q.text, q.ans, null]);
      paintQ("no");
      $("speed").innerHTML = `<span style="color:var(--red)">答案是 ${q.ans}</span>`;
      if (set.mode === "practice") {
        retry.push({ q, at: done + 3 });
        $("help").innerHTML = `<div class="help">${helpHTML(q)}<button class="go" style="margin-top:10px;font-size:1.2rem;padding:10px" onclick="nextQ()">看懂了，下一題 →</button></div>`;
        waiting = true;
      } else { waiting = true; setTimeout(() => { if (waiting && !$("s-play").hidden) nextQ(); }, 1000); }
      hud();
    }
  }
  function hud() {
    $("combo").textContent = combo >= 3 ? `🔥 ${combo}` : "";
    if (set.mode === "practice") { $("prog").textContent = `第 ${Math.min(done + (waiting ? 0 : 1), N_PRACTICE)} / ${N_PRACTICE} 題`; $("clock").textContent = `✓ ${right}`; }
    else { $("prog").textContent = `✓ ${right} 題`; $("clock").textContent = `⏱️ ${left}`; $("bar").style.width = left / SECS * 100 + "%"; $("bar").style.background = left <= 10 ? "var(--red)" : "var(--green)"; }
  }
  // 每題的小計時條：3 秒內是綠色
  function qtick() {
    if (!$("s-play").hidden && !waiting) { const s = (performance.now() - t0) / 1000; $("qt").style.width = Math.min(100, s / 6 * 100) + "%"; $("qt").style.background = s < 3 ? "var(--green)" : s < 6 ? "var(--yellow)" : "var(--red)"; }
    qtimer = requestAnimationFrame(qtick);
  }
  function start() {
    done = 0; right = 0; combo = 0; times = []; slowList = []; retry = []; left = SECS;
    startXP = window.FUN ? FUN.loadX().xp : 0;
    $("tbar").style.display = set.mode === "timed" ? "" : "none";
    show("s-play"); nextQ();
    window.FUN && FUN.hold(true);
    cancelAnimationFrame(qtimer); qtick();
    clearInterval(timer);
    if (set.mode === "timed") timer = setInterval(() => { left--; hud(); if (left <= 0) end(); }, 1000);
  }
  function end() {
    clearInterval(timer); cancelAnimationFrame(qtimer); waiting = false;
    show("s-end");
    const avg = times.length ? times.reduce((a, b) => a + b, 0) / times.length : 0;
    const fast = times.filter(t => t < 3).length;
    $("etitle").textContent = set.mode === "timed" ? "時間到！" : "練完 20 題！";
    const stars = set.mode === "timed" ? (right >= 25 ? 3 : right >= 15 ? 2 : right >= 6 ? 1 : 0) : (right >= 19 && avg < 4 ? 3 : right >= 15 ? 2 : right >= 8 ? 1 : 0);
    $("stars").textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
    $("sum").innerHTML = `<div><b>${right}</b>答對</div><div><b>${avg ? avg.toFixed(1) : "–"}</b>平均秒數</div><div><b>${fast}</b>⚡ 3 秒內</div>`;
    let rec = "";
    if (set.mode === "timed") {
      let d = {}; try { d = JSON.parse(localStorage.getItem("mif-games")) || {}; } catch (e) {}
      d.mental = d.mental || {}; const old = d.mental[comboKey()];
      if (old === undefined || right > old) { d.mental[comboKey()] = right; try { localStorage.setItem("mif-games", JSON.stringify(d)); } catch (e) {} }
      rec = right > 0 && (old === undefined || right > old) ? `<span class="newrec">🏆 新紀錄！</span>` : old !== undefined ? `<p class="bestline">最多：${Math.max(old, right)} 題</p>` : "";
      if (right > 0 && (old === undefined || right > old)) { window.FUN && FUN.gain(10, "game", "心算 60 秒新紀錄"); }
    }
    const got = window.FUN ? FUN.loadX().xp - startXP : 0;
    $("rec").innerHTML = rec + (got > 0 ? `<p style="font-weight:900;color:var(--orange)">這次拿到 ⭐ ${got} XP</p>` : "");
    if (stars >= 2) { fun("done"); window.FUN && FUN.confetti(); } else fun("ok");
    const uniq = []; slowList.forEach(s => { if (!uniq.some(u => u[0] === s[0])) uniq.push(s); });
    $("slow").innerHTML = uniq.length ? `<h3 style="margin-top:0">要多練的</h3><p style="margin:0;color:var(--muted);font-weight:700">（答錯或超過 4 秒）</p><div class="row" style="margin-top:8px">${uniq.map(([t, a, s]) =>
      `<span class="topic" style="flex:0 0 auto;cursor:default">${t} = ${a}<small>${s ? s.toFixed(1) + " 秒" : "答錯"}</small></span>`).join("")}</div>` : `<p class="perfect">🌟 每一題都又快又對！</p>`;
    scrollTo(0, 0);
    window.FUN && FUN.hold(false);
  }
  $("go").addEventListener("click", start);
  $("again").addEventListener("click", start);
  $("back").addEventListener("click", () => { show("s-start"); paintMenu(); });
  paintMenu();
  window.__game = { get q() { return q; }, key, start, end };
</script>
</body>
</html>
